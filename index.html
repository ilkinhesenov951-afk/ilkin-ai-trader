<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ILKIN OTC 15 SEC - FIX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080f20;color:#fff;font-family:Arial;padding:14px}
h1{color:#20d49b;margin:0;font-size:22px}p{color:#9eacc5;margin:6px 0;font-size:13px}
.card{background:#141e32;border:1px solid #293953;border-radius:16px;padding:14px;margin:12px 0}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair{background:#202e47;border-radius:10px;padding:11px;text-align:center;cursor:pointer;border:2px solid transparent;font-size:13px}
.pair.active{border-color:#20d49b;background:#20d49b;color:#07151b;font-weight:bold}
#chart{width:100%;height:400px;display:block;background:#0d1528;border-radius:12px}
.signal{font-size:19px;font-weight:bold;padding:14px;border-radius:12px;text-align:center;margin:10px 0}
.call{background:#20d49b;color:#07151b}.put{background:#ff4d6d;color:#fff}.wait{background:#202e47;color:#9eacc5}
.row{display:flex;justify-content:space-between;font-size:12px;margin:6px 0}
b{color:#fff}
</style>
</head>
<body>
<h1>ILKIN OTC • 15 SANİYƏ</h1>
<p>OTC BAZAR - SÜNİ QİYMƏT • EMA 9/21 • RSI 14 (70/30)</p>

<div class="card">
<div class="pairs" id="pairs"></div>
</div>

<div class="card">
<div class="row"><span>Seçilmiş: <b id="cur">EUR/USD OTC</b></span><span>TF: <b>15s</b></span><span>Qiymət: <b id="price">-</b></span></div>
<canvas id="chart" width="800" height="400"></canvas>
<div class="row"><span>EMA9: <b id="ema9">-</b></span><span>EMA21: <b id="ema21">-</b></span><span>RSI: <b id="rsi">-</b></span></div>
<div id="sig" class="signal wait">Yüklənir...</div>
<p id="info" style="font-size:12px;color:#9eacc5">Növbəti şamı gözləyirik... 80 yox, 70/30 ilə işləyirik.</p>
</div>

<script>
const OTC_PAIRS=["EUR/USD OTC","GBP/USD OTC","USD/JPY OTC","AUD/USD OTC","USD/CAD OTC","EUR/JPY OTC","GBP/JPY OTC","EUR/GBP OTC","NZD/USD OTC","USD/CHF OTC"];
const basePrice={"EUR/USD OTC":1.0850,"GBP/USD OTC":1.2700,"USD/JPY OTC":148.50,"AUD/USD OTC":0.6500,"USD/CAD OTC":1.3600,"EUR/JPY OTC":161.0,"GBP/JPY OTC":188.0,"EUR/GBP OTC":0.8550,"NZD/USD OTC":0.6100,"USD/CHF OTC":0.8800};

let curPair=OTC_PAIRS[0];
let price=basePrice[curPair];
let candles=[];
let canvas=document.getElementById('chart');
let ctx=canvas.getContext('2d');
let lastCandleTime=Date.now();
let currentCandle={o:price,h:price,l:price,c:price};

function initCandles(){
  candles=[];
  let p=basePrice[curPair];
  for(let i=0;i<50;i++){
    let o=p;
    let change=(Math.random()-0.5)*0.002;
    let c=o+change;
    let h=Math.max(o,c)+Math.random()*0.0006;
    let l=Math.min(o,c)-Math.random()*0.0006;
    candles.push({o,h,l,c});
    p=c;
  }
  price=p;
  currentCandle={o:price,h:price,l:price,c:price};
  lastCandleTime=Date.now();
}

function calcEMA(data, period){
  if(data.length<period) return null;
  let k=2/(period+1);
  let ema=0;
  for(let i=0;i<period;i++) ema+=data[i].c;
  ema=ema/period;
  for(let i=period;i<data.length;i++) ema=data[i].c*k + ema*(1-k);
  return ema;
}
function calcRSI(data, period=14){
  if(data.length<=period) return 50;
  let gains=0,losses=0;
  for(let i=data.length-period;i<data.length;i++){
    let diff=data[i].c - data[i-1].c;
    if(diff>=0) gains+=diff; else losses+=-diff;
  }
  if(losses===0) return 70;
  let rs=gains/losses;
  return 100 - (100/(1+rs));
}

function draw(){
  let W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  if(candles.length<2) return;
  let all=[...candles, currentCandle];
  let min=Math.min(...all.map(c=>c.l));
  let max=Math.max(...all.map(c=>c.h));
  let pad=(max-min)*0.15||0.001;
  min-=pad; max+=pad;
  
  all.forEach((c,i)=>{
    let x=(i/all.length)*W + 10;
    let cw=W/all.length*0.6;
    let yO=H - ((c.o-min)/(max-min))*H*0.8 - 20;
    let yC=H - ((c.c-min)/(max-min))*H*0.8 - 20;
    let yH=H - ((c.h-min)/(max-min))*H*0.8 - 20;
    let yL=H - ((c.l-min)/(max-min))*H*0.8 - 20;
    let col=c.c>=c.o?'#20d49b':'#ff4d6d';
    ctx.strokeStyle=col; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x+cw/2,yH); ctx.lineTo(x+cw/2,yL); ctx.stroke();
    ctx.fillStyle=col;
    ctx.fillRect(x, Math.min(yO,yC), cw, Math.max(3,Math.abs(yO-yC)));
  });
}

function updateSignal(){
  let ema9=calcEMA(candles,9);
  let ema21=calcEMA(candles,21);
  let rsi=calcRSI(candles,14);
  document.getElementById('ema9').textContent=ema9?ema9.toFixed(5):'-';
  document.getElementById('ema21').textContent=ema21?ema21.toFixed(5):'-';
  document.getElementById('rsi').textContent=rsi?rsi.toFixed(1):'-';
  document.getElementById('price').textContent=price.toFixed(5);
  
  let sigEl=document.getElementById('sig');
  if(!ema9||!ema21) return;
  let last=candles[candles.length-1];
  let body=Math.abs(last.c-last.o);
  if(body>0.0012){
    sigEl.className='signal wait';
    sigEl.textContent='⏸️ GÖZLƏ - Böyük şam, növbəti 15s gözlə';
    return;
  }
  if(ema9>ema21 && rsi>52 && rsi<70){
    sigEl.className='signal call';
    sigEl.textContent='📈 CALL - AL - 15s';
  } else if(ema9<ema21 && rsi<48 && rsi>30){
    sigEl.className='signal put';
    sigEl.textContent='📉 PUT - SAT - 15s';
  } else {
    sigEl.className='signal wait';
    sigEl.textContent='⏸️ GÖZLƏ - 15s bağlansın';
  }
}

setInterval(()=>{
  let vol=curPair.includes('JPY')?0.05:0.0005;
  price+= (Math.random()-0.5)*vol;
  currentCandle.c=price;
  currentCandle.h=Math.max(currentCandle.h,price);
  currentCandle.l=Math.min(currentCandle.l,price);
  if(Date.now()-lastCandleTime>=15000){
    candles.push({...currentCandle});
    if(candles.length>60) candles.shift();
    currentCandle={o:price,h:price,l:price,c:price};
    lastCandleTime=Date.now();
    updateSignal();
  }
  draw();
},250);

function selectPair(p){
  curPair=p; price=basePrice[p];
  document.getElementById('cur').textContent=p;
  document.querySelectorAll('.pair').forEach(b=>b.classList.toggle('active', b.textContent===p));
  initCandles(); draw(); updateSignal();
}

let div=document.getElementById('pairs');
OTC_PAIRS.forEach(p=>{
  let b=document.createElement('div');
  b.className='pair'; b.textContent=p;
  b.onclick=()=>selectPair(p);
  div.appendChild(b);
});
initCandles();
selectPair(OTC_PAIRS[0]);
draw();
updateSignal();
</script>
</body>
</html>
