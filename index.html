<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLAUDE OPTION PRO BOT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap');
body{margin:0;background:#0a0e1a;color:#fff;font-family:Inter,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:15px}
.app{width:100%;max-width:420px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:12px;color:#8a94a8}
.bot-card{background:#fdfcf8;border-radius:18px;color:#111;padding:18px 18px 14px;box-shadow:0 20px 40px rgba(0,0,0,0.4);margin-top:10px;border:1px solid #e8e2d9}
.bot-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bot-header .left{display:flex;align-items:center;gap:8px}
.logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:1px}
.ver{font-size:11px;background:#f0ece3;padding:3px 8px;border-radius:20px}
.selects{display:flex;gap:6px}
.sel{font-size:11px;border:1px solid #ddd;padding:4px 8px;border-radius:6px;background:#fff}
.title{font-family:'Playfair Display',serif;font-size:34px;text-align:left;margin:10px 0 2px;letter-spacing:2px}
.sub{font-size:11px;color:#8a7e6f;letter-spacing:1.2px;margin-bottom:12px}
.pairbox{background:#f5f1e8;border:1px solid #e8e2d9;border-radius:8px;padding:8px 12px;font-size:12px;display:inline-block;margin-bottom:18px}
.signal-area{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.spinner{width:48px;height:48px;border:3px solid #e8e2d9;border-top:3px solid #111;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.calc{margin-top:16px;font-size:13px;color:#6b645c}
.result{display:none;text-align:center;width:100%}
.prob{font-size:64px;font-weight:800;font-family:'Playfair Display',serif;margin:0}
.call{color:#0f9d6a}.put{color:#e03a4f}
.action{font-size:28px;font-weight:800;margin:6px 0;letter-spacing:2px}
.payout{font-size:12px;background:#111;color:#fff;padding:6px 14px;border-radius:20px;margin-top:10px;display:inline-block}
.timer{font-size:12px;color:#8a7e6f;margin-top:12px}
.bar{width:100%;height:6px;background:#f0ece3;border-radius:10px;margin-top:14px;overflow:hidden}
.fill{height:100%;width:0%;background:#111;transition:width 0.3s}
.bottom{display:flex;justify-content:space-between;margin-top:18px;border-top:1px solid #f0ece3;padding-top:12px;font-size:10px;color:#aaa}
.pairs-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:16px}
.pbtn{background:#151b2c;color:#8a94a8;border:1px solid #202940;padding:10px;border-radius:10px;font-size:11px;cursor:pointer;text-align:center}
.pbtn.active{background:#fdfcf8;color:#111;border-color:#111;font-weight:700}
.liveprice{font-size:11px;color:#8a94a8;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><span>TRADING OPTION PRO</span><span id="liveTime">UTC +3:00</span></div>

  <div class="bot-card">
    <div class="bot-header">
      <div class="left"><div class="logo">C.</div><div class="ver">V3.0</div></div>
      <div class="selects"><div class="sel">UTC +3:00</div><div class="sel">English</div></div>
    </div>
    <div class="title">CLAUDE</div>
    <div class="sub">OPTION PRO BOT<br>AI Signal Terminal V3.0</div>
    <div class="pairbox" id="pairBox">EUR/CHF (OTC) • 5 s • Payout: 92%</div>

    <div class="signal-area" id="signalArea">
      <div id="loading"><div class="spinner"></div><div class="calc">Calculating Probabilities...</div></div>
      <div class="result" id="result">
        <div class="prob" id="prob">87%</div>
        <div class="action" id="action">CALL</div>
        <div class="payout" id="payout">CONFIDENCE: HIGH • 5 SEC</div>
        <div class="timer" id="timer">Next signal in: 5s</div>
        <div class="bar"><div class="fill" id="fill"></div></div>
      </div>
    </div>
    <div class="bottom"><span>Signals</span><span>Indicators</span><span>Reviews</span><span>FAQ</span></div>
  </div>

  <div class="pairs-grid" id="pairs"></div>
  <div class="liveprice" id="livePrice">Real forex price syncing...</div>
</div>

<script>
const PAIRS=["EUR/USD (OTC)","GBP/USD (OTC)","EUR/CHF (OTC)","USD/JPY (OTC)","AUD/USD (OTC)","USD/CAD (OTC)","EUR/JPY (OTC)","GBP/JPY (OTC)","EUR/GBP (OTC)","NZD/USD (OTC)"];
let cur="EUR/CHF (OTC)", realPrices={}, candles={}, lastSignalTime=0;

async function fetchReal(){
  try{
    let r=await fetch('https://open.er-api.com/v6/latest/USD'); let j=await r.json(); if(!j.rates) return;
    let R=j.rates;
    realPrices["USD/JPY (OTC)"]=R.JPY; realPrices["USD/CAD (OTC)"]=R.CAD; realPrices["USD/CHF (OTC)"]=R.CHF;
    realPrices["EUR/USD (OTC)"]=1/R.EUR; realPrices["GBP/USD (OTC)"]=1/R.GBP; realPrices["AUD/USD (OTC)"]=1/R.AUD; realPrices["NZD/USD (OTC)"]=1/R.NZD;
    if(realPrices["EUR/USD (OTC)"]) { realPrices["EUR/CHF (OTC)"]=realPrices["EUR/USD (OTC)"]*realPrices["USD/CHF (OTC)"]; realPrices["EUR/JPY (OTC)"]=realPrices["EUR/USD (OTC)"]*realPrices["USD/JPY (OTC)"]; }
    if(realPrices["GBP/USD (OTC)"]) realPrices["GBP/JPY (OTC)"]=realPrices["GBP/USD (OTC)"]*realPrices["USD/JPY (OTC)"];
    if(realPrices["EUR/USD (OTC)"] && realPrices["GBP/USD (OTC)"]) realPrices["EUR/GBP (OTC)"]=realPrices["EUR/USD (OTC)"]/realPrices["GBP/USD (OTC)"];
    Object.keys(realPrices).forEach(p=>{ if(!candles[p]) candles[p]=[]; let price=realPrices[p]+(Math.random()-0.5)*0.0006; candles[p].push(price); if(candles[p].length>50) candles[p].shift(); });
    document.getElementById('livePrice').textContent=cur+' REAL: '+(realPrices[cur]?realPrices[cur].toFixed(5):'-')+' • Live sync';
  }catch(e){}
}

function calcEMA(arr,per){ if(arr.length<per) return null; let k=2/(per+1), ema=arr.slice(0,per).reduce((a,b)=>a+b,0)/per; for(let i=per;i<arr.length;i++) ema=arr[i]*k+ema*(1-k); return ema; }
function calcRSI(arr,per=14){ if(arr.length<=per) return 50; let g=0,l=0; for(let i=arr.length-per;i<arr.length;i++){ let d=arr[i]-arr[i-1]; if(d>=0) g+=d; else l+=-d; } if(l==0) return 70; return 100-(100/(1+g/l)); }

function generateSignal(){
  document.getElementById('loading').style.display='block'; document.getElementById('result').style.display='none';
  setTimeout(()=>{
    let arr=candles[cur]||[]; if(arr.length<21){ setTimeout(generateSignal,2000); return; }
    let ema9=calcEMA(arr,9), ema21=calcEMA(arr,21), rsi=calcRSI(arr,14);
    let prob=55+Math.random()*35; // 55-90%
    let isCall=ema9>ema21;
    if(rsi>70) isCall=false; if(rsi<30) isCall=true;
    // add randomness for OTC
    if(Math.random()>0.6) isCall=!isCall; 

    document.getElementById('loading').style.display='none'; document.getElementById('result').style.display='block';
    document.getElementById('prob').textContent=Math.floor(prob)+'%';
    document.getElementById('prob').className='prob '+(isCall?'call':'put');
    document.getElementById('action').textContent=isCall?'CALL ▲':'PUT ▼';
    document.getElementById('action').className='action '+(isCall?'call':'put');
    document.getElementById('fill').style.width=prob+'%';
    document.getElementById('pairBox').textContent=cur+' • 5 s • Payout: 92%';
    // countdown
    let c=5; let intv=setInterval(()=>{ c--; document.getElementById('timer').textContent='Next signal in: '+c+'s'; if(c<=0){ clearInterval(intv); generateSignal(); } },1000);
  }, 1800+Math.random()*1200);
}

function selectPair(p){ cur=p; document.querySelectorAll('.pbtn').forEach(b=>b.classList.toggle('active',b.dataset.p==p)); generateSignal(); }

let grid=document.getElementById('pairs');
PAIRS.forEach(p=>{ let d=document.createElement('div'); d.className='pbtn'+(p===cur?' active':''); d.dataset.p=p; d.textContent=p; d.onclick=()=>selectPair(p); grid.appendChild(d); });

setInterval(fetchReal,3000); fetchReal(); generateSignal();
setInterval(()=>{ document.getElementById('liveTime').textContent=new Date().toUTCString().slice(17,25)+' UTC'; },1000);
</script>
</body>
</html>
